name: OpenWaze
options:
  bundleIdPrefix: org.openwaze
  deploymentTarget:
    iOS: "17.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
targets:
  OpenWaze:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: MapLibre
    # Merged with the generated Info.plist. Background location and audio keep
    # guidance and spoken prompts going with the screen locked; LocationFeed
    # only enables background updates while navigating.
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [location, audio]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OPENWAZE_API_URL: $(OPENWAZE_API_URL)
        # Plain HTTP only to the local dev server (#11); anything else stays HTTPS.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openwaze.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: OpenWaze shows your position on the map.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES # String(localized:) keys -> Localizable.xcstrings
      # Reports server (server/). Debug defaults to the local dev server;
      # Release has no default and must set it (CI, or xcodebuild OPENWAZE_API_URL=...),
      # else the app asserts and shows the reports as unavailable.
      configs:
        Debug:
          OPENWAZE_API_URL: http://localhost:8787
  OpenWazeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/Tests]
    dependencies:
      - target: OpenWaze
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenWaze:
    build:
      targets:
        OpenWaze: all
    test:
      targets: [OpenWazeTests]
