name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
      server: ${{ steps.diff.outputs.server }}
      server_tests: ${{ steps.diff.outputs.server_tests }}
      scripts: ${{ steps.diff.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (new branch, force push): run everything.
          if files="$(git diff --name-only "$BASE" HEAD 2>/dev/null)"; then
            printf '%s\n' "$files"
          else
            echo "Cannot diff against base; running all jobs."
            files="$(printf 'App/\nserver/')"
          fi
          match() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          shared='^\.github/workflows/ci\.yml$'
          {
            echo "ios=$(match "^(App/|project\.yml$|Makefile$|Brewfile$|\.swiftlint\.yml$)|$shared")"
            echo "server=$(match "^server/|$shared")"
            echo "server_tests=$(match '^server/src/.*\.test\.ts$|^scripts/check-test-bites\.sh$')"
            echo "scripts=$(match "^scripts/.*\.mjs$|$shared")"
          } >> "$GITHUB_OUTPUT"

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - run: make bootstrap
      - run: make lint
      - run: make test

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci && npm test

  # Changed server tests must fail on the base branch's source and pass on HEAD.
  test-bites:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.server_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server
      # Run the BASE branch's copy of the script, so a PR cannot weaken the
      # check it is judged by. HEAD's copy is used only while base has none.
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          script="$RUNNER_TEMP/check-test-bites.sh"
          if ! git show "$BASE:scripts/check-test-bites.sh" > "$script" 2>/dev/null; then
            echo "Base has no check-test-bites.sh; using this PR's copy."
            cp scripts/check-test-bites.sh "$script"
          fi
          bash "$script" --base "$BASE"

  # Agent-loop scripts (#6): pure-logic unit tests, no dependencies.
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: node --test 'scripts/test/*.test.mjs'

  # The single required check: green when every relevant job passed or was skipped.
  ci-ok:
    needs: [changes, ios, server, test-bites, scripts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          IOS: ${{ needs.ios.result }}
          SERVER: ${{ needs.server.result }}
          BITES: ${{ needs.test-bites.result }}
          SCRIPTS: ${{ needs.scripts.result }}
        run: |
          echo "changes=$CHANGES ios=$IOS server=$SERVER test-bites=$BITES scripts=$SCRIPTS"
          [ "$CHANGES" = success ] || exit 1
          for r in "$IOS" "$SERVER" "$BITES" "$SCRIPTS"; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
