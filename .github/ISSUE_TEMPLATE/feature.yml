name: Feature request
description: Suggest a new feature or change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is stuck, and when? Say what happens today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy
      description: Does it collect, store or send location? How is that kept minimal?
