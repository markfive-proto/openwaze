<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>OpenWaze live ETA</title>
  <!-- The preload carries the SRI hash; share.js's import of the same URL reuses this checked module. -->
  <link rel="modulepreload" href="{{JS_URL}}" integrity="{{JS_SRI}}" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{CSS_URL}}" integrity="{{CSS_SRI}}" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/t/share.css">
  <script type="module" src="/t/share.js"></script>
</head>
<body>
  <div id="map"></div>
  <div id="panel" role="status" aria-live="polite">
    <div id="dest"></div>
    <div id="status">Loading…</div>
  </div>
</body>
</html>
